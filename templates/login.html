<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { font-family: system-ui, Arial, sans-serif; margin: 2rem; }
    .card { max-width: 380px; margin: 0 auto; border: 1px solid #ddd; border-radius: 8px; padding: 1.5rem; }
    label { display: block; margin: 0.5rem 0 0.25rem; }
    input { width: 100%; padding: 0.5rem; margin-bottom: 0.75rem; }
    button { width: 100%; padding: 0.6rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Login</h1>
    <form action="{{ url_for('login') }}" method="POST" autocomplete="on">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" placeholder="you@example.com" required />

      <label for="password">Password</label>
      <input id="password" name="password" type="password" placeholder="Enter your password" required />

      <button type="submit">Sign in</button>
    </form>
  </div>
</body>
</html>

<!-- app/templates/login.html -->
{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<h2>Login</h2>
<form method="post">
    <label>Username:</label><br>
    <input type="text" name="username" required><br><br>

    <label>Password:</label><br>
    <input type="password" name="password" required><br><br>

    <button type="submit">Login</button>
</form>

<p>Don't have an account? <a href="/register">Register here</a>.</p>

{% if error %}
    <p class="error">{{ error }}</p>
{% endif %}
{% endblock %}
